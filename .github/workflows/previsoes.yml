name: Previsões

# Atualiza a página das previsões todos os dias e publica-a no GitHub Pages.
on:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write  # para guardar o registo das previsões no ramo "historico"
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Histórico (3 épocas chegam para a janela de 2 anos)
        run: python -m analise.cli historico --epocas 3
      # Cópia dos jogos das ligas cujo site recusa os servidores do GitHub (NBB, LNB),
      # guardada todos os dias no ramo "dados"; se o ramo não existir, segue sem ela
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: dados
          path: dados-basquete
      # Registo de todas as previsões publicadas (ramo "historico"); na primeira vez não existe
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: historico
          path: historico
      - run: python -m analise.cli pagina --saida site --dados-basquete dados-basquete --historico historico
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # Cada gravação fica com data e hora no git: prova de que a previsão é anterior ao jogo
      - name: Guarda o registo das previsões
        continue-on-error: true
        working-directory: historico
        env:
          TOKEN: ${{ github.token }}
        run: |
          if ! git rev-parse --verify -q HEAD >/dev/null 2>&1; then
            rm -rf .git
            git init -q -b historico
            git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            printf '# Histórico\n\nTodas as previsões publicadas no site, guardadas antes de cada jogo, com o resultado final.\nGeradas pelo workflow Previsões (`python -m analise.cli pagina --historico`).\n' > README.md
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "sem alterações"; exit 0; fi
          git commit -q -m "Previsões e resultados ($(date -u '+%Y-%m-%d %H:%M') UTC)"
          git push origin HEAD:historico

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
