name: Previsões

# Atualiza a página das previsões todos os dias e publica-a no GitHub Pages.
on:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Histórico (3 épocas chegam para a janela de 2 anos)
        run: python -m analise.cli historico --epocas 3
      # Cópia dos jogos das ligas cujo site recusa os servidores do GitHub (NBB, LNB),
      # guardada todos os dias no ramo "dados"; se o ramo não existir, segue sem ela
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: dados
          path: dados-basquete
      - run: python -m analise.cli pagina --saida site --dados-basquete dados-basquete
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
